name: Nasuraya virtual learning (offline)
on:
  pull_request:
    paths:
      - 'examples/nasuraya_virtual_learning/**'
      - '.github/workflows/nasuraya-virtual-learning.yml'
  push:
    paths:
      - 'examples/nasuraya_virtual_learning/**'
      - '.github/workflows/nasuraya-virtual-learning.yml'
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and receipt tests
        run: python -m unittest discover -s examples/nasuraya_virtual_learning/tests -v
      - name: Deterministic finite proof
        run: |
          python -m examples.nasuraya_virtual_learning demo --db "$RUNNER_TEMP/nasuraya-nvle-${GITHUB_RUN_ID}.sqlite" > "$RUNNER_TEMP/nvle.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/nvle.json")); assert (d["before"]["correct"],d["after"]["correct"])==(2,6); assert d["final"]["native_actions"] == 0'

name: Nasuraya unified read-only integration contracts
on:
  pull_request:
    paths:
      - 'tools/nasu_unified_status.py'
      - 'tests/test_nasu_unified_status.py'
      - 'docs/NASURAYA_UNIFIED_INTEGRATION_2026-11-19_FA.md'
      - '.github/workflows/nasuraya-unified-status.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Compile adapter without installation
        run: python -B -m py_compile tools/nasu_unified_status.py
      - name: Pure synthetic fixtures, no live model or VPS
        run: python -B -m unittest discover -s tests -p test_nasu_unified_status.py -v

name: Nasuraya consciousness-indicator workbench (offline)
on:
  pull_request:
    paths:
      - 'examples/nasuraya_consciousness_lab/**'
      - 'docs/nasuraya-consciousness-indicators-v01-fa.md'
      - '.github/workflows/nasuraya-consciousness-indicators.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-probes:
    if: github.repository == 'zurvanproject/zohraya'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENAI_API_KEY: ''
      GH_HOST_TOKEN: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run fourteen indicator prototype experiments and adversarial tests
        run: python3 -m unittest examples.nasuraya_consciousness_lab.test_lab -v
      - name: Print evidence-limited, no-spend scientific report
        run: python3 -m examples.nasuraya_consciousness_lab > /tmp/nasuraya-indicators.json
      - name: Check no phenomenal-conscience assertion and all targets registered
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/nasuraya-indicators.json'))
          assert len(x['indicators'])==14
          assert all(v['toy_status']=='probe_passed' for v in x['indicators'])
          assert all(v['deployed_tadash_status']=='not_assessed' for v in x['indicators'])
          assert x['overall_consciousness_verdict'] is None
          assert x['paid_api_calls']==0 and x['api_used'] is False
          assert x['canonical_body_changed'] is False
          print('14 isolated toy probes passed; no deployed consciousness claims or paid requests')
          PY

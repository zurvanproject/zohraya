name: Nasuraya evidence self-model
on:
  pull_request:
    paths:
      - 'examples/nasuraya_self_model/**'
      - '.github/workflows/nasuraya-self-model.yml'
  push:
    branches: [main, 'nasuraya/**']
    paths:
      - 'examples/nasuraya_self_model/**'
      - '.github/workflows/nasuraya-self-model.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python3 -m unittest examples.nasuraya_self_model.test_monitor examples.nasuraya_self_model.test_goal_bridge examples.nasuraya_self_model.test_regulation examples.nasuraya_self_model.test_planning examples.nasuraya_self_model.test_energy -v
      - run: python3 -m examples.nasuraya_self_model.evaluate evaluate --output /tmp/self-model-evaluation

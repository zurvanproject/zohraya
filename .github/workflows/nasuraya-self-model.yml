name: Nasuraya evidence self-model
on:
  pull_request:
    paths:
      - 'examples/nasuraya_self_model/**'
      - '.github/workflows/nasuraya-self-model.yml'
  push:
    branches: [main, 'nasuraya/**']
    paths:
      - 'examples/nasuraya_self_model/**'
      - '.github/workflows/nasuraya-self-model.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python3 -m unittest examples.nasuraya_self_model.test_monitor examples.nasuraya_self_model.test_goal_bridge examples.nasuraya_self_model.test_regulation examples.nasuraya_self_model.test_planning examples.nasuraya_self_model.test_energy examples.nasuraya_self_model.test_route_trial examples.nasuraya_self_model.test_decision_relevance examples.nasuraya_self_model.test_metacognitive_control examples.nasuraya_self_model.test_experiential_sprint examples.nasuraya_self_model.test_embodied_learning -v
      - run: python3 -m examples.nasuraya_self_model.evaluate evaluate --output /tmp/self-model-evaluation
  metacognitive-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python3 -m examples.nasuraya_self_model.run_metacognitive evaluate --output /tmp/metacognitive-evaluation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metacognitive-results
          path: |
            /tmp/metacognitive-evaluation/results.json
            /tmp/metacognitive-evaluation/frozen-protocol.json
            /tmp/metacognitive-evaluation/cold-resume.json

  experiential-body-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python3 -m examples.nasuraya_self_model.run_sprint evaluate --output /tmp/experiential-body-trial
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experiential-body-evidence
          path: |
            /tmp/experiential-body-trial/results.json
            /tmp/experiential-body-trial/frozen-protocol.json
            /tmp/experiential-body-trial/cold-*.json

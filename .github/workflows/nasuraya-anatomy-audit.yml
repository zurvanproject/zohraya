name: Nasuraya anatomy audit contracts
on:
  pull_request:
    paths: ['examples/nasuraya_anatomy_audit/**', '.github/workflows/nasuraya-anatomy-audit.yml']
  push:
    branches: ['nasuraya/**']
    paths: ['examples/nasuraya_anatomy_audit/**', '.github/workflows/nasuraya-anatomy-audit.yml']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m unittest examples.nasuraya_anatomy_audit.test_audit -v

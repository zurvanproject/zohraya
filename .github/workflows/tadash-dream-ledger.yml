name: Tadash dream ledger offline tests
on:
  pull_request:
    paths:
      - 'experiments/tadash_four_tracks/dream_replay.py'
      - 'experiments/tadash_four_tracks/test_dream_replay.py'
      - '.github/workflows/tadash-dream-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-dream-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test strict imagined-versus-observed separation (no secrets / network)
        env:
          OPENAI_API_KEY: ''
          GITHUB_TOKEN: ''
          PYTHONNOUSERSITE: '1'
        run: |
          python3 -m unittest experiments.tadash_four_tracks.test_dream_replay -v

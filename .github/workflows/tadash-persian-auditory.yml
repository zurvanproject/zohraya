name: Tadash Persian auditory readout
on:
  pull_request:
    paths:
      - 'examples/nasuraya_auditory/**'
      - '.github/workflows/tadash-persian-auditory.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 2
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - run: python -m unittest examples.nasuraya_auditory.test_auditory -v
      - name: Load and run the pinned CPU model on generated silence
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from examples.nasuraya_auditory.__main__ import MODEL, REVISION
          import os, wave
          root = os.environ['RUNNER_TEMP']
          snapshot_download(MODEL, revision=REVISION, local_dir=root + '/model')
          with wave.open(root + '/control.wav', 'wb') as w:
              w.setparams((1, 2, 16000, 0, 'NONE', 'not compressed'))
              w.writeframes(bytes(32000))
          PY
          HF_HUB_OFFLINE=1 python -m examples.nasuraya_auditory "$RUNNER_TEMP/control.wav" --checkpoint "$RUNNER_TEMP/model" --output "$RUNNER_TEMP/control.json"
          python - <<'PY'
          import os, json
          from pathlib import Path
          from examples.nasuraya_auditory.__main__ import REVISION
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'control.json').read_text())
          window, = data['windows']
          event, = data['resonan_events']
          assert data['asr']['revision'] == REVISION and data['sample_count'] == 16000
          assert event['cortex']['loudness_proxy'] == 0
          assert window['lexical_status'] == 'below_pcm16_floor' and window['hypothesis'] is None
          assert isinstance(window['text'], str)
          print('Pinned CPU inference and real Resonan on the synthetic control passed.')
          PY

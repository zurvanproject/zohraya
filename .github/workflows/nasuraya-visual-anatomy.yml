name: Visual anatomy pose contract
on:
  pull_request:
    paths:
      - 'docs/visual/**'
      - 'tests/test_nasuraya_visual_anatomy.py'
      - '.github/workflows/nasuraya-visual-anatomy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pose-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify pose invariants and negative controls
        run: python -m unittest discover -s tests -p 'test_nasuraya_visual_anatomy.py' -v

name: Nasuraya bounded GitHub host
on:
  push:
    branches: ['nasuraya/github-host-v01', 'nasuraya/first-day-v01', 'nasuraya/first-day-api-v02']
    paths: ['continuity_host/**', '.github/workflows/nasuraya-continuity-host.yml']
  pull_request:
    paths: ['continuity_host/**', '.github/workflows/nasuraya-continuity-host.yml']
  schedule:
    - cron: '43 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto preserves regression until explicit research initialization'
        type: choice
        options: ['auto', 'initialize', 'initialize-model']
        default: 'auto'
permissions:
  contents: read
concurrency:
  group: nasuraya-bounded-continuity-host
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'zurvanproject/zohraya' && github.event.repository.private == false && (github.event_name == 'push' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7aaee60198b50246d90242d5155d3e3736882792
          path: source
          persist-credentials: false
      - run: python3 -m unittest continuity_host.test_host continuity_host.test_research continuity_host.test_model_research -v
      - run: python3 -m continuity_host.demo_research --output "$RUNNER_TEMP/first-day-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
  maintenance:
    if: github.repository == 'zurvanproject/zohraya' && github.event.repository.private == false && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7aaee60198b50246d90242d5155d3e3736882792
          path: source
          persist-credentials: false
      - run: python3 -m continuity_host.research_host source
        env:
          GH_HOST_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEARCH_MODE: ${{ inputs.mode || 'auto' }}

name: ATMOSPHERE COOL read-only offline contracts
on:
  pull_request:
    paths:
      - "tools/atmosphere_cool.py"
      - "tests/test_atmosphere_cool.py"
      - "docs/ATMOSPHERE_COOL_V01_FA.md"
      - "docs/ATMOSPHERE_COOL_V02_FA.md"
      - ".github/workflows/atmosphere-cool.yml"
permissions:
  contents: read
jobs:
  cool-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Strict, offline tests (no tokens or external API)
        run: |
          python -m py_compile tools/atmosphere_cool.py
          python -m unittest discover -s tests -p 'test_atmosphere_cool.py' -v
          python tools/atmosphere_cool.py --host
          python tools/atmosphere_cool.py --demo

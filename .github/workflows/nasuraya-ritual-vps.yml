name: Ritual VPS read-only bridge (native synthetic integration)

on:
  pull_request:
    paths:
      - 'examples/nasuraya_virtual_learning/**'
      - 'deploy/**'
      - 'docs/nasuraya-ritual-vps-readonly-fa.md'
      - '.github/workflows/nasuraya-ritual-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-read-only-integration:
    if: github.repository == 'zurvanproject/zohraya'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ''
      GH_HOST_TOKEN: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: ritual
          persist-credentials: false
      - name: Get separate pinned BodyLoop draft source
        run: |
          git clone --single-branch --depth=1 --branch feature/tadash-unified-cycle-v01-20261104 \
            https://github.com/zurvanproject/zohraya.git body
          git -C body rev-parse HEAD
      - name: Run each native and ritual test suite
        run: |
          (cd ritual && python3 -m unittest discover -s examples/nasuraya_virtual_learning/tests -v)
          (cd body && python3 -m examples.nasuraya_body_loop unified-test)
      - name: Prepare one bounded real *software-body* receipt on disposable CI fixture
        run: |
          mkdir -p -m 700 state
          cd body
          python3 -m examples.nasuraya_body_loop start --fixture normal \
            --mode bounded --max-actions 1 --session "$GITHUB_WORKSPACE/state/body.sqlite"
          python3 -m examples.nasuraya_body_loop unified-enable \
            --session "$GITHUB_WORKSPACE/state/body.sqlite" --desire-proxy 0.5
          python3 -m examples.nasuraya_body_loop unified-step \
            --session "$GITHUB_WORKSPACE/state/body.sqlite" --decision-id ci-ritual-1
          python3 -m examples.nasuraya_body_loop unified-status \
            --session "$GITHUB_WORKSPACE/state/body.sqlite"
      - name: Ritual finite run, then observe native receipt twice, without extra body action
        run: |
          cd ritual
          python3 -m examples.nasuraya_virtual_learning.daily \
            --db "$GITHUB_WORKSPACE/state/ritual.sqlite"
          python3 -m examples.nasuraya_virtual_learning.bridge \
            --ritual-db "$GITHUB_WORKSPACE/state/ritual.sqlite" \
            --bridge-db "$GITHUB_WORKSPACE/state/observer.sqlite" \
            --body-root "$GITHUB_WORKSPACE/body" \
            --body-session "$GITHUB_WORKSPACE/state/body.sqlite" \
            > "$GITHUB_WORKSPACE/state/first.json"
          python3 -m examples.nasuraya_virtual_learning.bridge \
            --ritual-db "$GITHUB_WORKSPACE/state/ritual.sqlite" \
            --bridge-db "$GITHUB_WORKSPACE/state/observer.sqlite" \
            --body-root "$GITHUB_WORKSPACE/body" \
            --body-session "$GITHUB_WORKSPACE/state/body.sqlite" \
            > "$GITHUB_WORKSPACE/state/second.json"
          python3 - <<'PY'
          import json
          import os
          import sqlite3
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]) / "state"
          first = json.loads((root/"first.json").read_text())
          second = json.loads((root/"second.json").read_text())
          assert first["native"]["completed_cycles"] == 1
          assert first["native"]["new_checkpoint_recorded"] is True
          assert second["native"]["new_checkpoint_recorded"] is False
          assert first["native"]["physical_actuation"] is False
          assert first["api_calls"] == 0
          assert first["ritual"]["synthetic_episodes"] == 3
          with sqlite3.connect(root/"observer.sqlite") as conn:
              assert conn.execute("SELECT COUNT(*) FROM native_status_snapshots").fetchone()[0] == 1
          with sqlite3.connect(root/"body.sqlite") as conn:
              # Observer never modifies native session / adds new native software-body action.
              assert conn.execute("SELECT COUNT(*) FROM decisions").fetchone()[0] == 1
          print("PASS: single synthetic native receipt observed twice, deduplicated, no API or extra step")
          PY

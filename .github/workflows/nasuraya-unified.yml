name: Nasuraya unified integration
on:
  pull_request:
    paths: ['nasuraya/**', 'integration/**', 'examples/**', 'experiments/affect_api_20261023/**', 'continuity_host/**', 'zohraya/**', '.github/workflows/nasuraya-unified.yml', '.github/workflows/nasuraya-continuity-host.yml']
  push:
    branches: ['nasuraya/unified-capabilities-v01']
permissions:
  contents: read
jobs:
  interfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7aaee60198b50246d90242d5155d3e3736882792
          path: source
          persist-credentials: false
      - name: Verify source coverage and preserved native sources
        run: python -m nasuraya.verify_sources
      - name: Verify unified command interfaces and real cold replay
        run: python -m unittest nasuraya.test_integration nasuraya.test_self_observe -v
      - name: Verify dialogue memory, pre-action forecasts and interrupted execution
        run: python -m nasuraya dialogue test
      - name: Verify measured experience and legacy API packet compatibility offline
        run: python -m nasuraya body experience-test
      - name: Verify independent evidence gate without API dispatch
        run: python -m unittest experiments.affect_api_20261023.test_prediction_router -v
      - name: Verify live daily memory contract and isolated cadence prototype
        run: python -m unittest continuity_host.test_host continuity_host.test_research continuity_host.test_model_research continuity_host.test_cadence_host continuity_host.test_cadence continuity_host.test_live_compatibility -v
      - name: Verify audited self-model projection
        run: python -m unittest discover -s zohraya/tests -v
      - name: Verify offline research continuation through shared launcher
        run: python -m nasuraya research-day --output "$RUNNER_TEMP/unified-research-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Verify combined aesthetics, metacognition and native recovery
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/runtimes/tadash_body
        run: python -m unittest examples.nasuraya_body_loop.test_unified_combinations -v
      - name: Verify default observer remains independent of optional dependencies
        run: python -S -m unittest examples.nasuraya_research.test_adapters examples.nasuraya_research.test_body_observer -v

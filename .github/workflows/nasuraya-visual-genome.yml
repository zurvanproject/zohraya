name: Nasuraya visual reference gate
on:
  pull_request:
    paths:
      - 'visual_genome/**'
      - '.github/workflows/nasuraya-visual-genome.yml'
  push:
    branches: [main, 'nasuraya/**']
    paths:
      - 'visual_genome/**'
      - '.github/workflows/nasuraya-visual-genome.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install 'Pillow>=11,<13'
      - name: Run 12 synthetic image gate tests
        run: python -m unittest discover -s visual_genome/tests -v

name: Nasuraya native self model step
on:
  push:
    branches: ['nasuraya/affect-api-session-20261023']
    paths: ['experiments/affect_api_20261023/self-model-authorization.json']
permissions:
  contents: read
concurrency:
  group: nasuraya-affect-api-20261023
  cancel-in-progress: false
jobs:
  self-model:
    if: github.repository == 'zurvanproject/zohraya'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify forecasting and budget contracts without live API
        run: |
          python3 -m unittest experiments.affect_api_20261023.test_self_model_step experiments.affect_api_20261023.test_session experiments.affect_api_20261023.test_clarification -v
          python3 -m examples.nasuraya_body_loop test
      - name: Forecast and compare with native-body receipts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_SESSION_TOKEN: ${{ github.token }}
        run: python3 -m experiments.affect_api_20261023.self_model_step

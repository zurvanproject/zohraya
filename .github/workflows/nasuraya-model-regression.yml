name: Nasuraya model offline regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nasuraya-model-regression.yml'
      - 'continuity_host/model_research.py'
      - 'continuity_host/test_model_research.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7aaee60198b50246d90242d5155d3e3736882792
          path: source
          persist-credentials: false
      - name: Test model and research without secrets or network
        run: python3 -m unittest continuity_host.test_model_research continuity_host.test_research -q

name: Nasurayaza read-only watch tests
on:
  pull_request:
    paths:
      - 'nasurayaza_watch/**'
      - '.github/workflows/nasurayaza-watch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Test observer without API credentials or network
        run: python3 -m unittest discover -s nasurayaza_watch/tests -v

name: Tadash persistent Windows VPS host
on:
  push:
    branches: ['nasuraya/tadash-vps-host-v01-20261107']
    paths: ['deploy/tadash_vps/**', 'deploy/tadash_vps_v01.bundle.b64', 'tests/test_tadash_vps_host.py', 'tools/bridge_jobs/tadash_*.py', '.github/workflows/tadash-vps-host.yml']
  pull_request:
    paths: ['deploy/tadash_vps/**', 'deploy/tadash_vps_v01.bundle.b64', 'tests/test_tadash_vps_host.py', 'tools/bridge_jobs/tadash_*.py', '.github/workflows/tadash-vps-host.yml']
permissions:
  contents: read
jobs:
  persistent-native-body:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Keep recovered source bytes unchanged
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify persistence, source, protection and replay
        run: python -m unittest discover -s tests -p test_tadash_vps_host.py -v


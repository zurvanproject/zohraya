name: Tadash neurovisceral source-pinned anatomy and coordination
on:
  push:
    branches:
      - feature/tadash-somatic-desire-coupling-v01-20261104
  pull_request:
    paths:
      - 'examples/nasuraya_body_loop/neurovisceral.py'
      - 'examples/nasuraya_body_loop/test_neurovisceral.py'
      - 'examples/nasuraya_body_loop/neurovisceral_demo.py'
      - 'examples/nasuraya_body_loop/experience.py'
      - '.github/workflows/tadash-neurovisceral.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  neurovisceral:
    if: github.repository == 'zurvanproject/zohraya'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ''
      GH_HOST_TOKEN: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Native neural and special organ source tests
        run: python3 -m examples.nasuraya_body_loop neurovisceral-test
      - name: Guard previous body-loop integration
        run: |
          python3 -m examples.nasuraya_body_loop autonomic-wave-test
          python3 -m examples.nasuraya_body_loop motivation-test
      - name: Native three cycle report
        run: python3 -m examples.nasuraya_body_loop neurovisceral-demo --output-dir "$RUNNER_TEMP/neurovisceral"
      - name: Verify claim boundaries and receipt totals
        run: |
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'neurovisceral' / 'summary.json').read_text())
          assert r['native_cycles'] == 3
          assert r['native_receipts'] == 3
          assert r['functional_pathways'] == 10
          assert len(r['special_organs']) == 3
          assert r['cold_reopen_verified']
          assert r['replay_extra_cycles'] == 0
          assert r['native_vitals_changed_by_overlay'] is False
          assert r['subjective_experience_inferred'] is False
          assert r['physical_actuation'] is False
          assert r['api_calls'] == 0
          assert r['modeled_desire_on']['heart_bpm'] >= r['modeled_desire_off']['heart_bpm']
          print("PASS: native receipt and source-pinned advisory physiology")
          PY

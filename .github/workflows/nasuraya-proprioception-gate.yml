name: Nasuraya proprioception external archive gate
on:
  pull_request:
    paths:
      - 'proprioception_gate/**'
      - '.github/workflows/nasuraya-proprioception-gate.yml'
  push:
    branches: [main, 'nasuraya/**']
    paths:
      - 'proprioception_gate/**'
      - '.github/workflows/nasuraya-proprioception-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Run 12 offline adversarial audit unit tests
        run: python -m unittest discover -s proprioception_gate/tests -v

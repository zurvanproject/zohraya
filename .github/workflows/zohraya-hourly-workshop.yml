name: Zohraya bounded hourly continuity workshop
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'One fixed offline regression; auto rotates by UTC hour'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - research
          - body-bridge
          - motion-mirror
          - native-reflection
  pull_request:
    paths:
      - 'workshop/**'
      - '.github/workflows/zohraya-hourly-workshop.yml'
permissions:
  contents: read
concurrency:
  group: 'zohraya-hourly-workshop-${{ github.ref }}'
  cancel-in-progress: false
jobs:
  single-bounded-task:
    if: github.repository == 'zurvanproject/zohraya' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Check offline workshop safety and regression tests
        run: python3 -m unittest discover -s workshop/tests -v
      - name: Run one preapproved offline regression
        env:
          REQUESTED_TASK: ${{ inputs.task || 'auto' }}
        shell: bash
        run: |
          set -euo pipefail
          task="$REQUESTED_TASK"
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            task='research'
          fi
          python3 -m workshop.runner --task "$task" --output "$RUNNER_TEMP/nasuraya-workshop"
      - name: Keep one inspectable receipt per run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zohraya-workshop-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nasuraya-workshop/receipt.json
          if-no-files-found: warn
          retention-days: 14

name: Nasuraya evidence-to-experiment offline contracts
on:
  pull_request:
    paths:
      - 'tools/nasu_evidence_to_experiment.py'
      - 'tests/test_nasu_evidence_to_experiment.py'
      - 'docs/NASURAYA_EVIDENCE_TO_EXPERIMENT_2026-11-19_FA.md'
      - '.github/workflows/nasuraya-evidence-to-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Compile offline coordinator
        run: python -B -m py_compile tools/nasu_evidence_to_experiment.py
      - name: Verify cross-ledger baseline and proposal gates
        run: |
          python -B -m unittest discover -s tests -p test_nasu_unified_status.py -v
          python -B -m unittest discover -s tests -p test_nasu_evidence_to_experiment.py -v

name: ATMOSPHERE defensive ritual simulator
on:
  pull_request:
    paths:
      - 'tools/atmosphere_defensive_ritual_sim.py'
      - 'tests/test_atmosphere_defensive_ritual_sim.py'
      - 'docs/rituals/ATMOSPHERE_DEFENSIVE_SIM_20261119_FA.md'
      - '.github/workflows/atmosphere-defensive-simulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-ritual-defenses:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Compile and test policy simulations
        run: |
          python -m py_compile tools/atmosphere_defensive_ritual_sim.py
          python -B -m unittest discover -s tests -p test_atmosphere_defensive_ritual_sim.py -v
          python -B -m tools.atmosphere_defensive_ritual_sim --audit

name: Nasuraya one-shot paid API probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nasuraya-one-shot-paid-probe.yml']
permissions:
  contents: read
concurrency:
  group: nasuraya-one-shot-paid-probe
  cancel-in-progress: false
jobs:
  one-paid-request:
    if: github.repository == 'zurvanproject/zohraya'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: One capped Responses API request, no retries
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          key = os.environ.get('OPENAI_API_KEY')
          if not key:
              print('FAIL: API_SECRET_MISSING')
              sys.exit(1)
          payload = {
              'model':'gpt-5.6-luna',
              'input':'به فارسی، در یک جملهٔ کوتاه بگو یک آزمایش علمی خوب چه ویژگی دارد.',
              'reasoning': {'effort':'none'},
              'max_output_tokens': 128,
              'store': False,
              'service_tier': 'default',
          }
          raw = json.dumps(payload, ensure_ascii=False).encode('utf-8')
          if len(raw) > 1200:
              print('FAIL: REQUEST_TOO_BIG')
              sys.exit(2)
          req = Request('https://api.openai.com/v1/responses', data=raw, method='POST',
                  headers={'Authorization': 'Bearer ' + key, 'Content-Type':'application/json'})
          print('SENDING_ONE_PAID_API_CALL (model=gpt-5.6-luna max_output_tokens=128)')
          try:
              with urlopen(req, timeout=35) as response:
                  data = json.load(response)
          except HTTPError as exc:
              print('FAIL: API_HTTP_STATUS=' + str(exc.code))
              print('NO_AUTOMATIC_RETRY')
              sys.exit(3)
          except URLError:
              print('FAIL: NETWORK_ERROR; request outcome unknown. NO_RETRY')
              sys.exit(4)
          except Exception as exc:
              print('FAIL: TRANSPORT_OR_PARSE_ERROR_TYPE=' + type(exc).__name__ + '; NO_RETRY')
              sys.exit(5)
          if not isinstance(data, dict):
              print('FAIL: NON_OBJECT_RESPONSE; NO_RETRY')
              sys.exit(6)
          print('RESPONSE_STATUS=' + str(data.get('status'))[:40])
          print('RESPONSE_KEYS=' + ','.join(sorted(str(k) for k in data)[:12]))
          usage=data.get('usage')
          if isinstance(usage,dict):
              print('USAGE_INPUT_TOKENS=' + str(usage.get('input_tokens'))[:30])
              print('USAGE_OUTPUT_TOKENS=' + str(usage.get('output_tokens'))[:30])
          if data.get('status')!='completed':
              print('FAIL: UNEXPECTED_RESPONSE; NO_RETRY')
              sys.exit(7)
          text_parts = []
          for item in data.get('output', []):
              if isinstance(item,dict) and item.get('type')=='message':
                  for part in item.get('content', []):
                      if isinstance(part,dict) and part.get('type')=='output_text':
                          text_parts.append(part.get('text',''))
          print('SUCCESS: PAID_RESPONSE_RECEIVED')
          print('REPLY=' + ' '.join(text_parts)[:350].replace('\\n',' '))
          print('NO_AUTOMATIC_RETRY; THIS_WORKFLOW_HAS_NO_SCHEDULE')
          PY

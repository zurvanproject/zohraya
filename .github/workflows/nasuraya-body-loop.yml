name: Nasuraya recovered body loop
on:
  pull_request:
    paths:
      - 'examples/nasuraya_body_loop/**'
      - 'examples/nasuraya_body_mirror/**'
      - 'examples/nasuraya_agent_loop/agents_api.py'
      - 'examples/nasuraya_agent_loop/api_recovery.py'
      - 'examples/nasuraya_agent_loop/local.py'
      - 'examples/nasuraya_agent_loop/tests/test_agents_api.py'
      - 'examples/nasuraya_agent_loop/requirements-api*'
      - 'runtimes/tadash_body/**'
      - '.github/workflows/nasuraya-body-loop.yml'
  push:
    branches: [main, 'nasuraya/**']
    paths:
      - 'examples/nasuraya_body_loop/**'
      - 'examples/nasuraya_body_mirror/**'
      - 'examples/nasuraya_agent_loop/agents_api.py'
      - 'examples/nasuraya_agent_loop/api_recovery.py'
      - 'examples/nasuraya_agent_loop/local.py'
      - 'examples/nasuraya_agent_loop/tests/test_agents_api.py'
      - 'examples/nasuraya_agent_loop/requirements-api*'
      - 'runtimes/tadash_body/**'
      - '.github/workflows/nasuraya-body-loop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-body:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Reproduce source-pinned native body regressions
        working-directory: runtimes/tadash_body
        run: python3 run_tests.py --reflection --output /tmp/nasuraya-native-check
      - name: Verify bounded bridge and cold recovery
        run: python3 -m examples.nasuraya_body_loop test
      - name: Verify host wakeups, real process crashes and exclusive execution
        run: python3 -m examples.nasuraya_body_loop wake-test
      - name: Verify care continuity across bounded awakenings
        run: python3 -m examples.nasuraya_body_loop care-test
      - name: Verify reduced experience in API input without a live service
        run: python3 -m examples.nasuraya_body_loop experience-test
      - name: Verify saved goal, action intent and unknown-outcome stops
        run: python3 -m examples.nasuraya_body_loop decision-test
      - name: Verify explicit host review of orphan API creation
        run: python3 -m examples.nasuraya_body_loop creation-test
      - name: Verify prepared persistent-host units without installation
        run: python3 -m unittest examples.nasuraya_body_loop.deployment.test_prepare_host -v
      - name: Verify persistent API body tools without live service
        run: |
          python3 -m venv .ci-env
          .ci-env/bin/python -m pip install -r examples/nasuraya_agent_loop/requirements-api.lock.txt
          .ci-env/bin/python -m examples.nasuraya_body_loop api-test
      - name: Regenerate and verify all committed motion samples
        run: python3 -m unittest examples.nasuraya_body_mirror.test_mirror -v
      - name: Execute actual local body cycles
        run: |
          python3 -m examples.nasuraya_body_loop demo --fixture sleep --steps 3 --max-actions 12 --output-dir /tmp/nasuraya-body-demo
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/nasuraya-body-demo')
          rows = [json.loads(line) for line in (root/'events.jsonl').read_text().splitlines()]
          summary = json.loads((root/'summary.json').read_text())
          assert summary['completed_cycles'] == 3 and summary['actions_remaining'] == 9
          assert not summary['external_model_api_used']
          assert [(r['outcome']['requested_action'], r['outcome']['actual_action']) for r in rows] == [('walk','protect'),('observe','observe'),('observe','observe')]
          assert all(abs(r['outcome']['body_audit']['energy_error_J']) < 1e-6 for r in rows)
          PY

name: Nasuraya rule transfer (offline)
on:
  pull_request:
    paths:
      - 'examples/nasuraya_research/rule_transfer_*.py'
      - 'examples/nasuraya_research/*lineage*.py'
      - 'tests/test_rule_transfer_probe_v01.py'
      - 'tests/test_*lineage.py'
      - 'docs/evidence/rule-transfer-lineage/**'
      - 'docs/NASURAYA_RULE_TRANSFER_V01_FA.md'
      - '.github/workflows/nasuraya-rule-transfer-v01.yml'
  push:
    branches: [main, 'nasuraya/**']
    paths:
      - 'examples/nasuraya_research/rule_transfer_*.py'
      - 'examples/nasuraya_research/*lineage*.py'
      - 'tests/test_rule_transfer_probe_v01.py'
      - 'tests/test_*lineage.py'
      - 'docs/evidence/rule-transfer-lineage/**'
      - 'docs/NASURAYA_RULE_TRANSFER_V01_FA.md'
      - '.github/workflows/nasuraya-rule-transfer-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Rule bank and lineage controls
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_rule_transfer_probe_v01.py' -v
          python -m unittest discover -s tests -p 'test_*lineage.py' -v
      - name: Verify data lock and original benchmark
        shell: bash
        run: |
          python - <<'PY'
          from examples.nasuraya_research.rule_transfer_probe_v01 import evaluate
          report = evaluate()
          assert report['fixture_sha256'] == 'f0b1a0373a2ae2786d1c7ed41938e291391ba3832cc8616abbbe0124f6e5cfce'
          assert report['total'] == 30
          assert report['correct'] == {'no_memory': 7, 'exact_episode': 11,
                                       'always_review': 16, 'rule_bank': 30}
          assert report['actual_api_calls'] == 0 and not report['live_server_changed']
          print(report['correct'])
          PY

name: Nasuraya Agent Network
on:
  pull_request:
    paths: ['nasuraya_agent_network/**', 'examples/nasuraya_body_loop/five_class_*.py', 'examples/nasuraya_body_loop/worker.py', 'examples/nasuraya_body_loop/__main__.py', '.github/workflows/nasuraya-agent-network.yml']
  push:
    branches: [main]
    paths: ['nasuraya_agent_network/**', 'examples/nasuraya_body_loop/five_class_*.py', 'examples/nasuraya_body_loop/worker.py', 'examples/nasuraya_body_loop/__main__.py', '.github/workflows/nasuraya-agent-network.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nasuraya-network-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  bounded-network:
    if: github.repository == 'zurvanproject/zohraya' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Test durable claims, crash recovery, concurrency, and network denial
        run: |
          set -o pipefail
          python3 -m unittest nasuraya_agent_network.tests -v 2>&1 | tee "$RUNNER_TEMP/network-tests.log"
      - name: Test stage-3 goal selection against crafted durable network receipts
        run: |
          set -o pipefail
          python3 -m unittest nasuraya_agent_network.test_goal_governor -v 2>&1 | tee "$RUNNER_TEMP/goal-governor-tests.log"
      - name: Verify one-shot stage-3 experiment admission and conservative replanning
        run: |
          set -o pipefail
          python3 -m unittest nasuraya_agent_network.test_stage3_cycle -v 2>&1 | tee "$RUNNER_TEMP/stage3-cycle-tests.log"
      - name: Test five-action metacognition, abstention, and no training leakage
        run: |
          set -o pipefail
          python3 -m unittest examples.nasuraya_body_loop.test_five_class_metacognition -v 2>&1 | tee "$RUNNER_TEMP/five-class-unit.log"
      - name: Run five repository specialists with two concurrent slots and frozen self-model holdout
        run: |
          python3 -m nasuraya_agent_network run \
            --workspace "$RUNNER_TEMP/nasuraya-network" \
            --run-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --max-workers 2 > "$RUNNER_TEMP/network-first.json"
      - name: Cold replay must be identical and must not execute workers again
        run: |
          python3 -m nasuraya_agent_network run \
            --workspace "$RUNNER_TEMP/nasuraya-network" \
            --run-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --max-workers 2 > "$RUNNER_TEMP/network-replay.json"
          cmp "$RUNNER_TEMP/network-first.json" "$RUNNER_TEMP/network-replay.json"
      - name: Propose one bounded research goal from verified five-worker receipts
        run: |
          python3 -m nasuraya_agent_network.goal_governor \
            --workspace "$RUNNER_TEMP/nasuraya-network" \
            --run-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$RUNNER_TEMP/nasuraya-network/stage3-goal.json"
      - name: Run exactly one allowed offline native experiment and propose a next goal
        run: |
          python3 -m nasuraya_agent_network.stage3_cycle \
            --workspace "$RUNNER_TEMP/nasuraya-network" \
            --run-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$RUNNER_TEMP/nasuraya-network/stage3-native-cycle" > "$RUNNER_TEMP/stage3-cycle-result.json"
      - name: Explicit separate five-action native shadow experiment
        run: |
          python3 -I nasuraya_agent_network/worker.py "$GITHUB_WORKSPACE" -m examples.nasuraya_body_loop five-class-probe \
            --training-file "$RUNNER_TEMP/nasuraya-network/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/self_model/self_model/training.json" \
            --output-dir "$RUNNER_TEMP/nasuraya-network/five-class-native" > "$RUNNER_TEMP/five-class-native.log"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'nasuraya-network/five-class-native/summary.json'
          summary = json.loads(path.read_text())
          assert summary['validation_passed'] is True
          assert summary['cases'] == summary['native_cycles'] == 24
          assert summary['model_api_calls'] == summary['physical_actuator_calls'] == summary['model_weight_updates'] == 0
          assert summary['can_act_autonomously'] is False
          assert summary['confidence_calibrated'] is False
          print(json.dumps({k:summary[k] for k in ('five_class_brier', 'pooled_five_class_brier', 'lifted_four_class_brier', 'slow_breath_events', 'exact_slow_breath_recall', 'selective_coverage', 'research_conclusion')}, sort_keys=True))
          PY
      - name: Verify canonical checkout was not changed
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Publish Persian run summary
        if: always()
        run: |
          report="$RUNNER_TEMP/nasuraya-network/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/REPORT_FA.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nasuraya-network-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/nasuraya-network/ledger.sqlite*
            ${{ runner.temp }}/nasuraya-network/ci-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/network-*.json
            ${{ runner.temp }}/network-tests.log
            ${{ runner.temp }}/goal-governor-tests.log
            ${{ runner.temp }}/stage3-cycle-tests.log
            ${{ runner.temp }}/stage3-cycle-result.json
            ${{ runner.temp }}/five-class-unit.log
            ${{ runner.temp }}/five-class-native.log
            ${{ runner.temp }}/nasuraya-network/stage3-native-cycle/
            ${{ runner.temp }}/nasuraya-network/stage3-goal.json
            ${{ runner.temp }}/nasuraya-network/five-class-native/

name: Nasuraya API credential smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nasuraya-api-credential-smoke.yml'
permissions:
  contents: read
jobs:
  verify-api-credential:
    if: github.repository == 'zurvanproject/zohraya'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check OPENAI_API_KEY through read-only API endpoint
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          key = os.environ.get('OPENAI_API_KEY', '').strip()
          if not key:
              print('FAIL: OPENAI_API_KEY secret is not configured or is empty.')
              sys.exit(1)
          if not key.isascii() or any(ord(ch) < 33 or ord(ch) > 126 for ch in key):
              print('FAIL: INVALID_KEY_FORMAT')
              sys.exit(1)
          req = Request(
              'https://api.openai.com/v1/models',
              headers={'Authorization': 'Bearer ' + key, 'Accept': 'application/json'},
          )
          try:
              with urlopen(req, timeout=25) as response:
                  result = json.load(response)
              models = result.get('data')
              if not isinstance(models, list):
                  raise ValueError('unexpected model list')
              listed = any(isinstance(m, dict) and m.get('id') == 'gpt-5.6-luna' for m in models)
              print('PASS: OpenAI API credential authenticated with GET /v1/models.')
              print('TARGET_MODEL_LISTED=' + str(listed).lower())
              print('PAID_MODEL_CALLS=0')
          except HTTPError as error:
              print('FAIL: API_HTTP_STATUS=' + str(error.code))
              print('No secret value or provider error body disclosed.')
              sys.exit(2)
          except URLError:
              print('FAIL: NETWORK_ERROR')
              sys.exit(3)
          except Exception as error:
              print('FAIL: UNEXPECTED_RESPONSE_TYPE=' + type(error).__name__)
              sys.exit(4)
          PY

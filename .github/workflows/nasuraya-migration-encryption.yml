name: Awake encrypted migration validation
on:
  pull_request:
    paths:
      - 'tools/bridge_jobs/nasu_awake_encrypted_export.py'
      - 'tools/nasu_migration_recipient_key.py'
      - 'tests/test_nasuraya_migration_export.py'
      - '.github/workflows/nasuraya-migration-encryption.yml'
  push:
    paths:
      - 'tools/bridge_jobs/nasu_awake_encrypted_export.py'
      - 'tools/nasu_migration_recipient_key.py'
      - 'tests/test_nasuraya_migration_export.py'
      - '.github/workflows/nasuraya-migration-encryption.yml'
  workflow_dispatch:
jobs:
  crypto-interoperability:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check RSA OAEP compatibility and script syntax
        run: |
          python3 -m py_compile tools/bridge_jobs/nasu_awake_encrypted_export.py tools/nasu_migration_recipient_key.py
          python3 -m unittest discover -s tests -p 'test_nasuraya_migration_export.py' -v

name: Native Tadash shadow integration (offline only)
on:
  pull_request:
    paths:
      - 'examples/nasuraya_consciousness_lab/**'
      - 'examples/nasuraya_body_loop/worker.py'
      - 'examples/nasuraya_body_loop/__main__.py'
      - 'docs/nasuraya-native-shadow-bridge-v01-fa.md'
      - '.github/workflows/nasuraya-native-shadow-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-native-shadow:
    if: github.repository == 'zurvanproject/zohraya'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENAI_API_KEY: ''
      GH_HOST_TOKEN: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run offline causal-shadow unit tests and 14 indicator prototypes
        run: |
          python3 -m unittest examples.nasuraya_consciousness_lab.test_lab examples.nasuraya_consciousness_lab.test_native_shadow -v
      - name: Execute true source-verified native Tadash simulator with shadow forecasts precommitted
        run: |
          python3 -m examples.nasuraya_body_loop native-shadow-eval --output-dir "$RUNNER_TEMP/nasuraya-native-shadow"
      - name: Check saved native evidence has no financial or actuator authority
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"nasuraya-native-shadow"
          x=json.loads((root/"summary.json").read_text())
          assert x["native_trials"] == 64
          assert x["training_trials"] == 40 and x["holdout_trials"] == 24
          assert x["actual_native_software_cycles"] == 64
          assert x["paid_api_calls"] == 0
          assert x["real_world_actuation"] is False
          assert x["production_tadash_modified"] is False
          assert x["shadow_could_control_native_action"] is False
          assert x["consciousness_verdict"] is None
          assert len(x["metrics"]) == 5
          print({k:v["mean_brier"] for k,v in x["metrics"].items() if isinstance(v,dict)})
          print("PASS: verified finite native software cycle, three shadow controls, no spending")
          PY

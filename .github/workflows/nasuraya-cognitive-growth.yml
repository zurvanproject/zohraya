name: Offline cognitive growth contracts
on:
  pull_request:
    paths:
      - 'tools/nasu_autonomous_cognition.py'
      - 'tools/install_nasu_autonomous_cognition.sh'
      - 'tests/test_nasu_autonomous_cognition.py'
      - 'docs/NASURAYA_OFFLINE_COGNITIVE_GROWTH_FA.md'
      - '.github/workflows/nasuraya-cognitive-growth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Syntax check
        run: bash -n tools/install_nasu_autonomous_cognition.sh && python -m py_compile tools/nasu_autonomous_cognition.py
      - name: Run deterministic offline tests
        run: python -B -m unittest discover -s tests -p test_nasu_autonomous_cognition.py -v

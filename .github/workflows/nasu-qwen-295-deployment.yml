name: Qwen 295 guarded deployment contracts
on:
  pull_request:
    paths:
      - 'tools/apply_nasu_cognition_295.py'
      - 'tests/test_apply_nasu_cognition_295.py'
      - '.github/workflows/nasu-qwen-295-deployment.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: |
          python3 -B -m unittest discover -s tests -p test_apply_nasu_cognition_295.py -v
          python3 -B -m unittest discover -s tests -p test_nasu_autonomous_cognition.py -v

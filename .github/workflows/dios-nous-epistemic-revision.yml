name: DIOS NOUS source-aware temporal revision (no network)
on:
  push:
    branches: ['research/epistemic-revision-v01-20261110']
    paths:
      - 'examples/nasuraya_research/epistemic_revision_v01.py'
      - 'tests/test_epistemic_revision_v01.py'
      - 'docs/research/DIOS_NOUS_EPISTEMIC_REVISION_PREREG_2026-11-10.md'
      - '.github/workflows/dios-nous-epistemic-revision.yml'
  pull_request:
    paths:
      - 'examples/nasuraya_research/epistemic_revision_v01.py'
      - 'tests/test_epistemic_revision_v01.py'
      - 'docs/research/DIOS_NOUS_EPISTEMIC_REVISION_PREREG_2026-11-10.md'
      - '.github/workflows/dios-nous-epistemic-revision.yml'
permissions:
  contents: read
jobs:
  development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline development tests, no sealed-holdout results
        run: |
          python -m py_compile examples/nasuraya_research/epistemic_revision_v01.py
          python -m unittest discover -s tests -p 'test_epistemic_revision_v01.py' -v
          python -m examples.nasuraya_research.epistemic_revision_v01 --dev
  holdout:
    needs: development
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: First-run fixed 160-case sealed synthetic benchmark
        run: python -m examples.nasuraya_research.epistemic_revision_v01 --holdout

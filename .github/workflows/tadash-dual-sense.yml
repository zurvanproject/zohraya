name: Tadash dual-sense native observer
on:
  pull_request:
    paths:
      - "experiments/tadash_dual_sense.py"
      - "experiments/test_tadash_dual_sense.py"
      - "experiments/tadash_dual_sense_benchmark.py"
      - "assets/nasuraya_articulated_v03/nasuraya.xml"
      - ".github/workflows/tadash-dual-sense.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-dual-sense:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen CPU MuJoCo
        run: python -m pip install -r examples/nasuraya_research/articulated/requirements-trial.txt
      - name: Evaluate world-frame virtual pose and fault-injection controls
        run: python -m unittest experiments.test_tadash_dual_sense -v
      - name: Run development two-modal challenge
        run: python -m experiments.tadash_dual_sense_benchmark --split dev --output "$RUNNER_TEMP/tadash-dual-sense-dev.json"
      - name: Run frozen, untouched holdout two-modal challenge
        run: python -m experiments.tadash_dual_sense_benchmark --split holdout --output "$RUNNER_TEMP/tadash-dual-sense-holdout.json"
      - name: Archive evidence, including any failed benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tadash-dual-sense-dev
          path: |
            ${{ runner.temp }}/tadash-dual-sense-dev.json
            ${{ runner.temp }}/tadash-dual-sense-holdout.json
          if-no-files-found: warn

name: Nasuraya body morphology trial
on:
  pull_request:
    paths:
      - 'examples/nasuraya_research/articulated/**'
      - 'assets/nasuraya_articulated_v03/**'
      - '.github/workflows/nasuraya-body-canon-trial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r examples/nasuraya_research/articulated/requirements-trial.txt
      - name: Morphology, control and checkpoint regressions
        run: python -m unittest examples.nasuraya_research.articulated.test_canon_trial examples.nasuraya_research.articulated.test_balance examples.nasuraya_research.articulated.test_stepping examples.nasuraya_research.articulated.test_checkpoint examples.nasuraya_research.articulated.test_experience_balance -v
      - name: Reproduce saved baseline and calibrated two-step rollouts
        run: |
          python - <<'PY'
          import json
          import platform
          import numpy as np
          import scipy
          from pathlib import Path
          from examples.nasuraya_research.articulated.canon_trial import build_candidate
          from examples.nasuraya_research.articulated.stepping import walk_trial
          from examples.nasuraya_research.articulated.experience_balance import read_plan, select_policy
          folder=Path('evidence/experience-balance-v01')
          model=build_candidate()
          plan=read_plan(folder)
          rows=[json.loads((folder/f'train-{c["id"]}-{b:+.3f}.json').read_text())
                for b in plan['candidates_m'] for c in plan['training']]
          policy=json.loads((folder/'policy.json').read_text())
          assert select_policy(plan,rows)==policy
          print({'python':platform.python_version(),'machine':platform.machine(),'platform':platform.platform()})
          np.show_runtime()
          scipy.show_config()
          differences=[]
          for bias in sorted({0.,policy['selected_bias_m']}):
              r=walk_trial(steps=2,model_dir=model,geometry_support=True,com_bias_x_m=bias)
              expected=json.loads((folder/f'train-train_nominal-{bias:+.3f}.json').read_text())['result']
              print({k:v for k,v in r.items() if k!='trace'})
              assert r['walk_pass'] and r['final_max_generalized_speed']<.05
              assert 0 <= r['tilt_rms_deg'] <= r['max_tilt_deg']
              assert abs(r['measured_seconds']-r['simulated_seconds']) < 1e-8
              for field in ('tilt_rms_deg','max_tilt_deg'):
                  differences.append((bias,field,r[field],expected[field],abs(r[field]-expected[field])))
              assert abs(r['simulated_seconds']-expected['simulated_seconds']) < 1e-7
          print({'cross_environment_differences':differences})
          assert all(d[-1]<5e-5 for d in differences), differences
          PY

name: Nasuraya workload migration validation
on:
  push:
    paths:
      - 'tools/bridge_jobs/nasu_migration_inventory.py'
      - 'tools/nasu_workload*'
      - 'tools/validate_nasu_workload_archives.py'
      - 'tools/install_nasu_workloads.sh'
      - 'tools/nasuraya_linux_bridge.py'
      - 'tools/nasu_migration_bridge_recovery.ps1'
      - 'tests/test_nasu_workload*'
      - '.github/workflows/nasuraya-workload-migration.yml'
  pull_request:
    paths:
      - 'tools/bridge_jobs/nasu_migration_inventory.py'
      - 'tools/nasu_workload*'
      - 'tools/validate_nasu_workload_archives.py'
      - 'tools/install_nasu_workloads.sh'
      - 'tools/nasuraya_linux_bridge.py'
      - 'tools/nasu_migration_bridge_recovery.ps1'
      - 'tests/test_nasu_workload*'
      - '.github/workflows/nasuraya-workload-migration.yml'
jobs:
  inventory-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_nasu_workload*.py' -v
      - run: python3 -m py_compile tools/nasu_workload_sources.py tools/nasuraya_linux_bridge.py tools/bridge_jobs/nasu_migration_inventory.py
      - run: bash -n tools/install_nasu_workloads.sh
      - name: Parse guarded recovery without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tools/nasu_migration_bridge_recovery.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
  public-archive-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual immutable public archives without executing workloads
        run: python3 tools/validate_nasu_workload_archives.py

name: Zohraya read-only self-model regression
on:
  pull_request:
    paths: ['zohraya/**', '.github/workflows/zohraya-self-model.yml']
  push:
    branches: [main, 'nasuraya/**']
    paths: ['zohraya/**', '.github/workflows/zohraya-self-model.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Run offline deterministic projection tests
        run: python -m unittest discover -s zohraya/tests -v

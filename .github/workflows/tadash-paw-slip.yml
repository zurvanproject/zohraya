name: Measure native paw slip
on:
  pull_request:
    paths:
      - 'experiments/tadash_paw_slip.py'
      - 'experiments/test_tadash_paw_slip.py'
      - 'experiments/tadash_weight_shift.py'
      - '.github/workflows/tadash-paw-slip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  slip:
    strategy:
      fail-fast: false
      matrix:
        engine: ['3.11.0', '4.0.0']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: research
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c6bac77802a7fab9178fb00eed28e3c4410b9482
          path: pinned-motion
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated pinned engine and trial dependencies
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          constraints=pinned-motion/examples/nasuraya_research/articulated/requirements-trial.txt
          if [ "$ENGINE" = "3.11.0" ]; then
            python -m pip install -r "$constraints"
          else
            sed "s/^mujoco==3.11.0$/mujoco-core==$ENGINE/" "$constraints" > "${RUNNER_TEMP}/slip-deps.txt"
            python -m pip install -r "${RUNNER_TEMP}/slip-deps.txt"
          fi
          python -c 'import mujoco, os; assert mujoco.__version__ == os.environ["ENGINE"]'

      - name: Check native contact kinematics
        working-directory: research
        run: python -m unittest -v experiments.test_tadash_paw_slip
      - name: Six native trials and per-paw slip
        working-directory: research
        run: python -m experiments.tadash_paw_slip --motion-source ../pinned-motion --output "${RUNNER_TEMP}/paw-slip"
      - uses: actions/upload-artifact@v4
        with:
          name: native-paw-slip-${{ matrix.engine }}
          path: ${{ runner.temp }}/paw-slip
          if-no-files-found: error

name: ATMOSPHERE ritual and V06 foot-contact bridge
on:
  pull_request:
    paths:
      - 'tools/atmosphere_ritual_posture_v03.py'
      - 'tests/test_atmosphere_ritual_posture_v03.py'
      - 'docs/rituals/ATMOSPHERE_RITUAL_POSTURE_V03_FA.md'
      - '.github/workflows/atmosphere-ritual-posture-v03.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-contact-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify actual contact source plus prior ritual contracts
        run: |
          python -m py_compile tools/atmosphere_ritual_posture_v03.py
          python -B -m unittest discover -s tests -p test_atmosphere_defensive_ritual_sim.py -v
          python -B -m unittest discover -s tests -p test_atmosphere_defensive_practice_v02.py -v
          python -B -m unittest discover -s tests -p test_atmosphere_ritual_posture_v03.py -v
          python -B -m tools.atmosphere_ritual_posture_v03 --audit

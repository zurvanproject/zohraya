name: Tadash Awake offline contracts
on:
  pull_request:
    paths: ['tadash_awake/**', '.github/workflows/tadash-awake.yml']
  push:
    paths: ['tadash_awake/**', '.github/workflows/tadash-awake.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m unittest tadash_awake.test_wake -v
      - run: python -m tadash_awake init --root /tmp/nasuraya-awake-ci
      - run: python -m tadash_awake status --root /tmp/nasuraya-awake-ci

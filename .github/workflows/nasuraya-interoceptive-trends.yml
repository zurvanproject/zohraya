name: Nasuraya interoceptive trends
on:
  pull_request:
    paths:
      - 'runtimes/tadash_body/**'
      - '.github/workflows/nasuraya-interoceptive-trends.yml'
  push:
    branches: [main, 'nasuraya/**']
    paths:
      - 'runtimes/tadash_body/**'
      - '.github/workflows/nasuraya-interoceptive-trends.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: runtimes/tadash_body
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Create synthetic defaults
        run: python3 synthetic_fixture.py
      - name: Verify source parity, observer and existing bridge
        run: python3 -m unittest -v test_interoceptive_trends test_neuropelvic test_neuropelvic_body
      - name: Evaluate frozen signals and native trajectories
        run: python3 run_interoceptive_trends.py --output /tmp/tadash-interoceptive-trends-ci
      - name: Check the original native solver
        run: python3 run_tests.py --output /tmp/tadash-interoceptive-native-ci

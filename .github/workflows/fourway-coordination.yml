name: Nasuraya four-way coordination safety checks
on:
  push:
    branches: ['nasuraya/fourway-coordination-v01-20261110']
    paths:
      - 'tools/fourway_coordinator.py'
      - 'tests/test_fourway_coordinator.py'
      - '.github/workflows/fourway-coordination.yml'
  pull_request:
    paths:
      - 'tools/fourway_coordinator.py'
      - 'tests/test_fourway_coordinator.py'
      - '.github/workflows/fourway-coordination.yml'
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: No-network regression
        run: |
          python -m py_compile tools/fourway_coordinator.py
          python -m unittest discover -s tests -p 'test_fourway_coordinator.py' -v

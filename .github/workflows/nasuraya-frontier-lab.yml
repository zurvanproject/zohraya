name: Nasuraya Frontier Lab offline contracts
on:
  pull_request:
    paths:
      - 'tools/nasu_frontier_lab.py'
      - 'tools/install_nasu_frontier_lab.sh'
      - 'tests/test_nasu_frontier_lab.py'
      - 'docs/NASURAYA_FRONTIER_LAB_FA.md'
      - '.github/workflows/nasuraya-frontier-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-unprivileged-inference-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: bash -n tools/install_nasu_frontier_lab.sh
      - run: python3 -B -m unittest discover -s tests -p test_nasu_frontier_lab.py -v
      - run: python3 -m py_compile tools/nasu_frontier_lab.py

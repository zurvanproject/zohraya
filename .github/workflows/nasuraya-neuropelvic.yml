name: Nasuraya neuro-pelvic native coupling
on:
  pull_request:
    paths:
      - 'runtimes/tadash_body/**'
      - '.github/workflows/nasuraya-neuropelvic.yml'
  push:
    branches: [main, 'nasuraya/**']
    paths:
      - 'runtimes/tadash_body/**'
      - '.github/workflows/nasuraya-neuropelvic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-coupling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: runtimes/tadash_body
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Create isolated synthetic defaults
        run: python3 synthetic_fixture.py
      - name: Verify cycle, native coupling and cold restoration
        run: python3 -m unittest -v test_neuropelvic test_neuropelvic_body
      - name: Compare matched native trajectories
        run: python3 run_neuropelvic_demo.py --output /tmp/tadash-neuropelvic-ci

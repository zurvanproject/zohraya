name: Nasuraya GitHub Bridge v2 offline contracts
on:
  pull_request:
    paths:
      - 'tools/bridge_v2/**'
      - 'tests/test_bridge_v2.py'
      - 'docs/BRIDGE_V2_FA.md'
      - '.github/workflows/nasuraya-bridge-v2.yml'
permissions:
  contents: read
jobs:
  v2-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Run local offline contract tests (no network requests)
        run: python -B -m unittest discover -s tests -p test_bridge_v2.py -v
